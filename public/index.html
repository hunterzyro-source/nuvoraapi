<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Nuvora API</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111116; color: #f4f1fa; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(440px, calc(100% - 48px)); padding: 32px; border: 1px solid #34313e; border-radius: 18px; background: #1b1921; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { color: #b7b1c3; line-height: 1.6; }
      a { color: #c49aff; }
      code { color: #d8c4ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Nuvora API</h1>
      <p>Serviço de canais e chamadas do Nuvora. Para verificar a disponibilidade, acesse <a href="/api/health"><code>/api/health</code></a>.</p>
    </main>
  </body>
</html>
