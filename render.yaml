services:
  - type: web
    name: nuvora-api
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://nuvora-ten-nu.vercel.app
      - key: PUBLIC_APP_URL
        value: https://nuvora-ten-nu.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: nuvora-db
          property: connectionString

databases:
  - name: nuvora-db
    databaseName: nuvora
    user: nuvora
    region: virginia
    plan: 0.1c-256mb
    diskSizeGB: 15
